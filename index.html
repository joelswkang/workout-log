var HOW={
bench:{en:["Lie back with your eyes under the bar or dumbbells. Feet flat, shoulder blades pulled back and down.","Lower to mid-chest with elbows about 45° from your body, then press up until your arms are straight.","Keep wrists stacked over elbows and don’t bounce the weight off your chest."],
 ko:["눈이 바(덤벨) 아래에 오도록 눕고, 발은 바닥에 두고 견갑을 뒤로·아래로 모으세요.","팔꿈치를 몸에서 약 45° 벌려 가슴 중앙까지 내린 뒤 팔이 펴질 때까지 밀어 올리세요.","손목이 팔꿈치 바로 위에 오게 하고 가슴에서 반동을 주지 마세요."]},
mpress:{en:["Adjust the seat so the handles line up with mid-chest. Back flat against the pad.","Press forward until your arms are nearly straight, then return slowly.","Keep your shoulders down and don’t lock out hard."],
 ko:["손잡이가 가슴 중앙 높이에 오도록 시트를 조절하고 등을 패드에 붙이세요.","팔이 거의 펴질 때까지 밀고 천천히 돌아오세요.","어깨를 내리고 팔꿈치를 세게 잠그지 마세요."]},
fly:{en:["Keep a slight bend in your elbows and your chest up.","Open your arms wide until you feel a chest stretch, then bring your hands together in an arc.","Hold the elbow bend steady. This is not a press."],
 ko:["팔꿈치를 살짝 굽히고 가슴을 펴세요.","가슴이 늘어나는 느낌이 들 때까지 팔을 벌린 뒤 원을 그리며 손을 모으세요.","팔꿈치 각도를 유지하세요. 프레스 동작이 아니에요."]},
push:{en:["Hands (or bars) just outside shoulder width and your body in a straight line.","Lower until your chest (or upper arms) is about parallel to the floor, then push back up.","Brace your core and don’t let your hips sag."],
 ko:["손(또는 바)을 어깨너비보다 약간 넓게 잡고 몸을 일직선으로 만드세요.","가슴(또는 상완)이 바닥과 거의 평행해질 때까지 내린 뒤 밀어 올리세요.","코어에 힘을 주고 골반이 처지지 않게 하세요."]},
ohp:{en:["Stand or sit tall with the weight at shoulder height and your core braced.","Press straight overhead until your arms are extended, then lower under control to your shoulders.","Don’t arch your lower back. Squeeze your glutes."],
 ko:["바른 자세로 서거나 앉아 무게를 어깨 높이에 두고 코어에 힘을 주세요.","머리 위로 똑바로 밀어 올린 뒤 어깨까지 천천히 내리세요.","허리를 꺾지 말고 엉덩이에 힘을 주세요."]},
raise:{en:["Stand tall with a slight bend in your elbows and the weights at your sides.","Raise the weights out to the side (or front) to shoulder height, then lower slowly.","Use a light weight and don’t swing."],
 ko:["팔꿈치를 살짝 굽히고 무게를 몸 옆에 두고 서세요.","무게를 옆(또는 앞)으로 어깨 높이까지 들어 올린 뒤 천천히 내리세요.","가벼운 무게를 쓰고 반동을 주지 마세요."]},
pdown:{en:["Stand close to the cable with your elbows pinned to your sides and chest up.","Push the handle down until your arms are straight, then let it rise until your forearms are about parallel to the floor.","Only your forearms move."],
 ko:["케이블 가까이 서서 팔꿈치를 옆구리에 붙이고 가슴을 펴세요.","팔이 펴질 때까지 아래로 누른 뒤 전완이 바닥과 평행해질 때까지 천천히 올라오세요.","전완만 움직여야 해요."]},
text:{en:["Keep your upper arms still with elbows pointing forward or up.","Bend at the elbows to lower the weight behind your head (or toward your forehead), then extend until your arms are straight.","Don’t let your elbows flare out."],
 ko:["상완을 고정하고 팔꿈치가 앞(또는 위)을 향하게 하세요.","팔꿈치를 굽혀 무게를 머리 뒤(또는 이마 쪽)로 내린 뒤 팔이 펴질 때까지 뻗으세요.","팔꿈치가 벌어지지 않게 하세요."]},
row:{en:["Hinge forward with a flat back (or sit tall) and your arms extended.","Pull the weight toward your lower ribs, squeezing your shoulder blades together, then lower slowly.","Lead with your elbows and don’t yank with your lower back."],
 ko:["등을 편 채 상체를 숙이거나(또는 바르게 앉아) 팔을 뻗으세요.","무게를 아랫갈비뼈 쪽으로 당기며 견갑을 모은 뒤 천천히 내리세요.","팔꿈치로 이끌고 허리 반동으로 당기지 마세요."]},
pull:{en:["Sit with your thighs under the pad and a grip slightly wider than your shoulders.","Pull the bar to your upper chest by driving your elbows down, then let it rise with control.","Lean back slightly and never pull behind your neck."],
 ko:["허벅지를 패드 아래에 넣고 어깨보다 약간 넓게 바를 잡으세요.","팔꿈치를 아래로 내리며 바를 상체 위쪽으로 당긴 뒤 천천히 올려 보내세요.","상체를 살짝 젖히고 목 뒤로 당기지 마세요."]},
pullup:{en:["Hang from the bar with your shoulders pulled down and a full stretch.","Pull until your chin clears the bar, then lower all the way down.","No kicking or swinging. Use a band or assisted option if you need it."],
 ko:["어깨를 내린 채 바에 매달려 몸을 충분히 늘리세요.","턱이 바 위로 올라올 때까지 당긴 뒤 끝까지 내려오세요.","반동을 쓰지 마세요. 필요하면 밴드나 보조 기구를 쓰세요."]},
rear:{en:["Set the weight at face height (or hinge forward) with soft elbows.","Pull or open your arms back toward your ears, squeezing your rear shoulders, then return slowly.","Use light weight and higher reps."],
 ko:["얼굴 높이에 케이블을 두거나 상체를 숙이고 팔꿈치를 살짝 굽히세요.","후면 어깨를 조이며 팔을 귀 쪽으로 당기거나 벌린 뒤 천천히 돌아오세요.","가벼운 무게로 높은 반복 횟수를 하세요."]},
curl:{en:["Stand tall (or sit) with your elbows tucked at your sides.","Curl the weight toward your shoulders, squeeze at the top, then lower slowly.","Keep your elbows still and don’t swing your body."],
 ko:["바르게 서거나 앉아 팔꿈치를 옆구리에 붙이세요.","무게를 어깨 쪽으로 말아 올려 위에서 조인 뒤 천천히 내리세요.","팔꿈치를 고정하고 몸을 흔들지 마세요."]},
squat:{en:["Feet about shoulder width, chest up, core braced, with the weight on your upper back or at your chest.","Sit down and back until your thighs are at least parallel, then drive through your whole foot to stand.","Knees track over your toes and your back stays neutral."],
 ko:["발을 어깨너비로 벌리고 가슴을 펴고 코어에 힘을 준 채, 무게는 등 위쪽이나 가슴 앞에 두세요.","엉덩이를 뒤로 빼며 허벅지가 바닥과 평행하거나 더 깊게 앉은 뒤 발 전체로 밀며 일어서세요.","무릎은 발끝 방향을 따르고 허리는 중립을 유지하세요."]},
lpress:{en:["Sit with your back flat against the pad and your feet shoulder width on the platform.","Lower until your knees reach about 90°, then press back up without locking your knees.","Don’t let your hips lift off the seat."],
 ko:["등을 패드에 붙이고 발을 어깨너비로 플랫폼에 올리세요.","무릎이 약 90°가 될 때까지 내린 뒤 무릎을 잠그지 말고 밀어 올리세요.","엉덩이가 시트에서 뜨지 않게 하세요."]},
lunge:{en:["Take a long step (or rest your rear foot on a bench) with your torso upright and weights at your sides.","Lower your back knee toward the floor, then drive up through your front heel.","Keep your front knee over your ankle."],
 ko:["보폭을 넓게 서거나(뒷발을 벤치에 올리고) 상체를 세우고 무게를 몸 옆에 두세요.","뒤쪽 무릎을 바닥 쪽으로 내린 뒤 앞발 뒤꿈치로 밀어 올라오세요.","앞쪽 무릎이 발목 위에 오게 하세요."]},
hinge:{en:["Feet hip width, weight close to your legs, back flat.","Push your hips back and lower the weight along your legs until you feel a hamstring stretch (to the floor for a deadlift), then drive your hips forward to stand.","Keep your spine neutral and never round your back."],
 ko:["발을 골반 너비로 벌리고 무게를 다리에 가깝게 두고 등을 평평하게 유지하세요.","엉덩이를 뒤로 빼며 햄스트링이 늘어나는 느낌이 들 때까지 무게를 다리를 따라 내린 뒤(데드리프트는 바닥까지) 엉덩이를 앞으로 밀며 일어서세요.","척추를 중립으로 유지하고 등을 둥글게 말지 마세요."]},
thrust:{en:["Upper back on a bench (or lie on the floor), feet flat, weight across your hips.","Drive your hips up until your body forms a straight line, squeeze your glutes, then lower.","Tuck your chin and don’t over-arch your lower back."],
 ko:["윗등을 벤치에 대거나 바닥에 누워 발을 평평하게 두고 무게를 골반 위에 올리세요.","몸이 일직선이 될 때까지 골반을 들어 올려 엉덩이를 조이고 내려오세요.","턱을 당기고 허리를 과하게 꺾지 마세요."]},
lmach:{en:["Adjust the pad to your shins or ankles and line your knees up with the machine’s pivot.","Extend (or curl) your legs smoothly, pause, then lower slowly.","No jerking. Control both directions."],
 ko:["패드를 정강이(발목)에 맞추고 무릎을 기구의 회전축에 맞추세요.","다리를 부드럽게 펴거나(굽히고) 잠시 멈춘 뒤 천천히 내리세요.","반동 없이 올릴 때와 내릴 때 모두 조절하세요."]},
calf:{en:["Balls of your feet on the edge, heels free to drop.","Rise as high as you can, pause, then lower to a full stretch.","Use a slow tempo."],
 ko:["발볼을 모서리에 올리고 뒤꿈치는 아래로 내릴 수 있게 하세요.","최대한 높이 올라가 잠시 멈춘 뒤 끝까지 늘어나게 내려오세요.","천천히 움직이세요."]}};

var NOTES={"Incline bench press":["Set the bench to about 30°.","벤치를 약 30°로 세우세요."],"Incline dumbbell press":["Set the bench to about 30°.","벤치를 약 30°로 세우세요."],"Smith machine bench press":["Position the bench so the bar lowers to mid-chest.","바가 가슴 중앙으로 내려오도록 벤치 위치를 맞추세요."],
 "Close-grip bench press":["Hands about shoulder width and elbows tucked to hit the triceps.","손을 어깨너비로 잡고 팔꿈치를 붙여 삼두를 자극하세요."],"Low-to-high cable fly":["Cables set low. Sweep your hands up and together to chest height.","케이블을 낮게 두고 가슴 높이까지 위로 모으세요."],
 "Pec deck":["Keep your elbows at shoulder height.","팔꿈치를 어깨 높이에 두세요."],"Dips":["Lean slightly forward for chest, stay upright for triceps.","가슴은 상체를 약간 숙이고, 삼두는 상체를 세우세요."],"Bench dips":["Hands on a bench behind you with heels on the floor.","벤치를 뒤로 짚고 뒤꿈치는 바닥에 두세요."],
 "Arnold press":["Start with palms facing you and rotate them outward as you press.","손바닥이 얼굴을 향한 상태에서 올리며 바깥으로 돌리세요."],"Cable lateral raise":["Cable set low on the opposite side of your working arm.","운동하는 팔의 반대쪽 낮은 케이블을 쓰세요."],
 "Overhead cable triceps extension":["Face away from the cable with elbows by your ears.","케이블을 등지고 팔꿈치를 귀 옆에 두세요."],"Skull crusher":["Lower the bar toward your forehead, then extend.","바를 이마 쪽으로 내린 뒤 펴세요."],"Dumbbell kickback":["Hinge forward with your upper arm parallel to the floor.","상체를 숙이고 상완을 바닥과 평행하게 유지하세요."],
 "Barbell row":["Bar over mid-foot and torso about 45°.","바를 발 중앙 위에 두고 상체를 약 45° 숙이세요."],"One-arm dumbbell row":["Support yourself with one hand and knee on a bench or a sturdy surface.","한 손과 한 무릎을 벤치(또는 단단한 곳)에 올려 지지하세요."],
 "Straight-arm pulldown":["Arms nearly straight. Sweep the bar down to your thighs.","팔을 거의 편 채 바를 허벅지까지 쓸어내리세요."],"Chin-up":["Palms facing you with a shoulder-width grip.","손바닥이 나를 향하게 어깨너비로 잡으세요."],"Hammer curl":["Palms face each other throughout.","손바닥이 서로 마주 보게 유지하세요."],
 "Incline dumbbell curl":["Sit back on an incline bench so your arms hang behind your torso.","벤치를 눕혀 앉아 팔이 몸통 뒤로 늘어지게 하세요."],"Preacher curl":["Rest your upper arms on the pad and don’t fully lock out at the bottom.","상완을 패드에 올리고 아래에서 완전히 펴지 마세요."],
 "Front squat":["Bar rests on your front shoulders with elbows high.","바를 앞쪽 어깨에 얹고 팔꿈치를 높게 유지하세요."],"Goblet squat":["Hold one dumbbell against your chest.","덤벨 하나를 가슴 앞에 안으세요."],"Smith machine squat":["Place your feet slightly in front of the bar.","발을 바보다 약간 앞에 두세요."],
 "Bulgarian split squat":["Rear foot resting on a bench behind you.","뒷발을 뒤쪽 벤치에 올리세요."],"Walking lunge":["Step forward each rep and alternate legs.","한 번 할 때마다 앞으로 걸으며 다리를 번갈아 하세요."],"Deadlift":["Bar over mid-foot. Lift by pushing the floor away.","바를 발 중앙 위에 두고 바닥을 밀어내듯 드세요."],
 "Good morning":["Bar on your upper back with soft knees.","바를 등 위쪽에 얹고 무릎을 살짝 굽히세요."],"Cable kickback":["Ankle strap on, kick straight back and squeeze.","발목 스트랩을 차고 뒤로 곧게 차며 조이세요."],"Glute bridge":["Lie on the floor, no bench needed.","바닥에 누워서 하며 벤치는 필요 없어요."],"Seated calf raise":["Pad on your lower thighs, knees at 90°.","패드를 허벅지 아래쪽에 두고 무릎을 90°로 하세요."]};

Object.assign(NOTES,{"Floor press":["Lie on the floor and stop when your upper arms touch it.","바닥에 누워 상완이 바닥에 닿으면 멈추세요."],"Hex press":["Squeeze the dumbbells together on your chest and press up while keeping them pressed.","덤벨을 가슴 위에서 서로 붙인 채 눌러 올리세요."],"Decline push-up":["Feet on a bench, hands on the floor.","발을 벤치에 올리고 손은 바닥을 짚으세요."],"Incline push-up":["Hands on a bench with your body in a straight line.","손을 벤치에 올리고 몸을 일직선으로 유지하세요."],"Diamond push-up":["Hands close so your thumbs and index fingers form a diamond.","엄지와 검지가 다이아몬드 모양이 되게 손을 모으세요."],"Pike push-up":["Hips high in an inverted V. Lower your head toward the floor.","엉덩이를 높이 든 역 V자에서 머리를 바닥 쪽으로 내리세요."],"Landmine press":["Press one end of the bar up and forward at an angle.","바 한쪽 끝을 비스듬히 위·앞으로 미세요."],"Dumbbell push press":["Dip slightly at the knees and use leg drive to start the press.","무릎을 살짝 굽혔다 펴는 힘으로 프레스를 시작하세요."],"Cable triceps kickback":["Hinge forward and extend your arm back with the upper arm still.","상체를 숙이고 상완을 고정한 채 팔을 뒤로 펴세요."],"Pendlay row":["Torso parallel to the floor and the bar returns to the floor every rep.","상체를 바닥과 평행하게 하고 매 반복마다 바를 바닥에 내려놓으세요."],"Inverted row":["Hang under a fixed bar with your body straight and pull your chest to the bar.","고정된 바 아래에 몸을 일직선으로 매달려 가슴을 바로 당기세요."],"Wide-grip seated cable row":["Wide grip. Pull to your upper stomach with elbows slightly flared.","넓게 잡고 팔꿈치를 약간 벌려 윗배 쪽으로 당기세요."],"Chest-supported dumbbell row":["Lie chest-down on an incline bench.","인클라인 벤치에 가슴을 대고 엎드리세요."],"Rear delt row":["Hinge forward and row with your elbows wide.","상체를 숙이고 팔꿈치를 넓게 벌려 당기세요."],"Concentration curl":["Brace your elbow against your inner thigh.","팔꿈치를 안쪽 허벅지에 대고 고정하세요."],"Spider curl":["Lie chest-down on an incline bench with your arms hanging.","인클라인 벤치에 엎드려 팔을 늘어뜨리세요."],"Bayesian cable curl":["Face away from the cable with your arm behind you.","케이블을 등지고 팔을 뒤쪽에 두세요."],"Reverse curl":["Overhand grip. This also works your forearms.","오버핸드 그립으로 하며 전완도 함께 자극돼요."],"Hack squat":["Feet shoulder width on the platform with your back flat on the pad.","발을 어깨너비로 플랫폼에 두고 등을 패드에 붙이세요."],"Step-up":["Step onto a bench and drive through your front heel.","벤치에 올라 앞발 뒤꿈치로 밀어 올라가세요."],"Stiff-leg deadlift":["Legs nearly straight with only a slight knee bend.","무릎을 살짝만 굽히고 다리를 거의 편 채 하세요."],"Single-leg Romanian deadlift":["Balance on one leg and hinge until your torso is parallel to the floor.","한 다리로 균형을 잡고 상체가 바닥과 평행해질 때까지 숙이세요."],"Sumo deadlift":["Wide stance, toes out, hands inside your knees.","발을 넓게 벌리고 발끝을 바깥으로, 손은 무릎 안쪽에 두세요."],"Cable pull-through":["Face away from the cable, hinge back, then thrust your hips forward.","케이블을 등지고 엉덩이를 뒤로 뺐다가 앞으로 밀어내세요."],"Single-leg glute bridge":["One foot on the floor and the other leg extended.","한 발은 바닥에 두고 다른 다리는 뻗으세요."],"Leg press calf raise":["Press with the balls of your feet on the lower edge of the platform.","플랫폼 아래쪽 가장자리에 발볼을 대고 미세요."],"Single-leg calf raise":["Hold a wall for balance and rise on one foot.","벽을 잡아 균형을 잡고 한 발로 올라가세요."]});
HOW.crunch={en:["Lie back with your knees bent and feet flat, hands by your ears or across your chest.","Curl your ribs toward your hips, pause, then lower slowly.","Don’t pull on your neck. Breathe out as you curl."],ko:["무릎을 굽히고 발을 바닥에 둔 채 누워 손은 귀 옆이나 가슴 위에 두세요.","갈비뼈를 골반 쪽으로 말아 올려 잠시 멈춘 뒤 천천히 내리세요.","목을 당기지 말고 올라올 때 숨을 내쉬세요."]};
HOW.lraise={en:["Hang from a bar (or lie flat on the floor) with your core braced.","Raise your knees or legs toward your chest, pause, then lower slowly.","No swinging, and don’t let your lower back arch."],ko:["바에 매달리거나 바닥에 누워 코어에 힘을 주세요.","무릎(또는 다리)을 가슴 쪽으로 들어 올려 잠시 멈춘 뒤 천천히 내리세요.","반동을 쓰지 말고 허리가 꺾이지 않게 하세요."]};
HOW.hold={en:["Forearms (or one forearm) on the floor with your body in a straight line from head to heels.","Hold the position, squeezing your abs and glutes while breathing steadily.","Don’t let your hips sag or pike up. The reps number is seconds."],ko:["팔뚝(또는 한쪽 팔뚝)을 바닥에 대고 머리부터 발뒤꿈치까지 일직선을 만드세요.","복근과 엉덩이를 조이며 호흡을 유지한 채 버티세요.","골반이 처지거나 솟지 않게 하세요. 횟수 칸의 숫자는 초예요."]};
HOW.twist={en:["Sit leaning back slightly with your feet raised or on the floor, or lie back for bicycle and heel touches.","Rotate your torso from side to side, reaching past each hip or bringing opposite elbow and knee together.","Rotate from your ribs, not just your arms."],ko:["상체를 살짝 뒤로 기울여 앉아 발을 들거나 바닥에 두세요(바이시클·힐 터치는 누워서).","상체를 좌우로 돌려 양쪽 골반 옆으로 손을 보내거나 반대쪽 팔꿈치와 무릎을 맞대세요.","팔이 아니라 갈비뼈에서부터 회전하세요."]};
HOW.cabcore={en:["Stand side-on to the cable with feet shoulder width apart and core braced.","Press out (or chop diagonally) with control, then return slowly.","Use light weight and keep your hips square unless the move is meant to rotate."],ko:["케이블 옆으로 서서 발을 어깨너비로 벌리고 코어에 힘을 주세요.","천천히 밀어내거나(대각선으로 당겨) 천천히 돌아오세요.","가벼운 무게를 쓰고 회전하는 동작이 아니라면 골반을 고정하세요."]};
HOW.cback={en:["Start on the floor: face down for Superman, on all fours for Bird dog.","Lift opposite arm and leg (or both arms and legs) slowly, hold briefly, then lower.","Keep your neck neutral and don’t over-arch."],ko:["슈퍼맨은 엎드려서, 버드독은 네발 자세로 시작하세요.","반대쪽 팔과 다리(또는 양팔·양다리)를 천천히 들어 잠시 버틴 뒤 내리세요.","목을 중립으로 유지하고 허리를 과하게 꺾지 마세요."]};
HOW.dyn={en:["Get into the start position with your core braced.","Move with control and keep your lower back stable throughout.","Quality over speed."],ko:["코어에 힘을 주고 시작 자세를 잡으세요.","허리를 안정적으로 유지하며 천천히 조절해서 움직이세요.","속도보다 정확한 자세가 중요해요."]};
var CADD={crunch:["McGill curl-up","Crunch","Weighted crunch","Decline sit-up","Sit-up","Cable crunch","Reverse crunch"],lraise:["Hanging knee raise","Hanging leg raise","Lying leg raise","Hanging oblique knee raise"],hold:["Knee plank","Plank","Side plank","Hollow body hold"],twist:["Russian twist","Weighted Russian twist","Bicycle crunch","Heel touch"],cabcore:["Cable woodchop","Pallof press"],cback:["Superman","Bird dog"],dyn:["Mountain climber","V-up","Dead bug","Barbell rollout","Dumbbell side bend"]};
for(var ck in CADD)CADD[ck].forEach(function(n){PM[n]=ck});
var CADD2={hold:["Bear plank hold","Side plank (knees)","Suitcase hold","Plank with leg lift"],dyn:["Plank shoulder taps","Heel slide dead bug","Bridge march","Plank jacks"],cabcore:["Half-kneeling Pallof press","Anti-rotation cable hold"],cback:["Quadruped leg lift"],lraise:["Flutter kicks","Seated knee tuck"],crunch:["Oblique crunch"],twist:["Landmine twist"]};

Object.assign(NOTES,{"Cable crunch":["Kneel facing the cable with the rope by your head and crunch down by curling your spine.","케이블을 향해 무릎 꿇고 로프를 머리 옆에 둔 채 척추를 말며 내려가세요."],"Decline sit-up":["Hook your feet under the pad and keep your chin tucked.","발을 패드에 걸고 턱을 당기세요."],"Reverse crunch":["Lift your hips off the floor by curling your pelvis toward your ribs.","골반을 갈비뼈 쪽으로 말아 엉덩이를 바닥에서 떼세요."],"Dead bug":["Lower the opposite arm and leg while pressing your lower back into the floor.","허리를 바닥에 붙인 채 반대쪽 팔과 다리를 내리세요."],"V-up":["Lift your legs and torso at the same time to meet in a V.","다리와 상체를 동시에 들어 V자로 만나게 하세요."],"Mountain climber":["From a high plank, drive your knees toward your chest alternately. Reps = total steps.","플랭크 자세에서 무릎을 번갈아 가슴 쪽으로 당기세요. 횟수는 전체 스텝 수예요."],"Barbell rollout":["Kneel and roll the bar forward as far as you can keep your back flat, then pull back.","무릎을 꿇고 허리가 평평하게 유지되는 만큼 바를 굴렸다가 되돌아오세요."],"Dumbbell side bend":["Hold one dumbbell and bend sideways, then return upright.","덤벨 하나를 들고 옆으로 숙였다가 바로 서세요."],"Heel touch":["Lie back with knees bent and reach each hand toward the same-side heel.","무릎을 굽히고 누워 같은 쪽 손으로 발뒤꿈치를 터치하세요."],"Bicycle crunch":["Bring opposite elbow to knee as you pedal your legs.","다리를 페달 밟듯 움직이며 반대쪽 팔꿈치와 무릎을 맞대세요."],"Cable woodchop":["Chop diagonally from high to low, rotating through your torso.","높은 곳에서 낮은 곳으로 대각선으로 당기며 몸통을 회전하세요."],"Pallof press":["Press straight out and resist the pull. Don’t rotate.","정면으로 밀어내며 케이블이 당기는 힘을 버티고 몸을 돌리지 마세요."],"Side plank":["Stack your feet and lift your hips so your body is a straight line sideways.","발을 포개고 골반을 들어 옆으로 일직선을 만드세요."],"Hollow body hold":["Press your lower back into the floor with arms and legs extended and raised.","허리를 바닥에 붙이고 팔과 다리를 뻗어 들어 올리세요."],"Weighted crunch":["Hold a dumbbell or plate on your chest.","덤벨이나 원판을 가슴 위에 올리세요."]});
Object.assign(NOTES,{"Bear plank hold":["On hands and knees, lift your knees one inch off the floor and hold with a flat back.","네발 자세에서 무릎을 바닥에서 2~3cm 띄우고 등을 평평하게 버티세요."],"Plank shoulder taps":["From a plank, tap one shoulder with the opposite hand without letting your hips rock. Reps = total taps.","플랭크에서 반대쪽 손으로 어깨를 터치하되 골반이 흔들리지 않게 하세요. 횟수는 전체 터치 수예요."],"Side plank (knees)":["Side plank with your knees bent and on the floor, forearm under your shoulder. Do each side.","무릎을 굽혀 바닥에 대고 팔뚝을 어깨 아래에 둔 사이드 플랭크예요. 양쪽 모두 하세요."],"Half-kneeling Pallof press":["Kneel on one knee side-on to the cable and press straight out without rotating.","한쪽 무릎을 꿇고 케이블 옆에 서서 몸을 돌리지 말고 정면으로 미세요."],"Heel slide dead bug":["Lie on your back with knees bent, slide one heel out along the floor and back while your lower back stays still.","무릎을 굽히고 누워 허리를 고정한 채 한쪽 발뒤꿈치를 바닥을 따라 뻗었다가 되돌리세요."],"Quadruped leg lift":["On all fours, extend one leg back to hip height and hold briefly. Don’t arch your lower back.","네발 자세에서 한쪽 다리를 엉덩이 높이로 뻗어 잠시 버티세요. 허리를 꺾지 마세요."],"Bridge march":["Hold a glute bridge and lift one foot at a time without letting your hips drop.","글루트 브릿지 자세를 유지한 채 골반이 내려가지 않게 한 발씩 들어 올리세요."],"Suitcase hold":["Hold one heavy dumbbell at your side and stand tall without leaning. Do each side.","무거운 덤벨 하나를 옆에 들고 기울지 않게 똑바로 서세요. 양쪽 모두 하세요."],"Plank with leg lift":["From a plank, lift one leg a few inches without rotating your hips.","플랭크에서 골반을 돌리지 않고 한 다리를 조금 드세요."],"Anti-rotation cable hold":["Hold the Pallof position with arms extended and resist the cable’s pull.","팔을 뻗은 팔로프 자세로 케이블이 당기는 힘을 버티세요."],"Flutter kicks":["Lie back with legs low and straight, kick them up and down in small alternating movements. Reps = seconds.","다리를 낮게 편 채 누워 작게 번갈아 위아래로 차세요. 횟수는 초예요."],"Plank jacks":["From a plank, jump your feet out and in like a jumping jack.","플랭크에서 발을 점핑잭처럼 벌렸다 모으세요."],"Oblique crunch":["Lie on your side or crunch toward one knee, bringing your elbow toward your hip.","옆으로 누워 팔꿈치를 골반 쪽으로 당기며 옆구리를 수축하세요."],"Seated knee tuck":["Sit on the edge of a bench leaning back slightly and pull your knees toward your chest.","벤치 끝에 앉아 상체를 약간 뒤로 기울이고 무릎을 가슴 쪽으로 당기세요."],"Landmine twist":["Hold the end of the bar with both hands and rotate it from hip to hip using your torso.","바 끝을 양손으로 잡고 몸통으로 좌우 골반 쪽으로 돌리세요."],"McGill curl-up":["Lie with one knee bent and your hands under your lower back. Lift only your head and shoulders a little and keep your spine neutral.","한쪽 무릎을 굽히고 손을 허리 밑에 둔 채 머리와 어깨만 살짝 들어 올리고 척추를 중립으로 유지하세요."],"Knee plank":["Plank from your knees with a straight line from head to knees.","무릎을 대고 머리부터 무릎까지 일직선으로 버티세요."],"Smith machine bent-over row":["Set the bar low, hinge at the hips and row to your waist with a flat back.","바를 낮게 놓고 엉덩이를 접어 등을 평평하게 유지하며 허리 쪽으로 당기세요."],"Smith machine inverted row":["Set the bar at hip height, hang underneath and pull your chest to the bar.","바를 골반 높이에 두고 아래에 매달려 가슴을 바 쪽으로 당기세요."],"Smith machine upright row":["Pull the bar up along your body to chest height with your elbows leading.","바를 몸을 따라 가슴 높이까지 팔꿈치가 이끌게 당기세요."],"Smith machine decline press":["Set the bench to a decline under the bar and press like a bench press.","벤치를 디클라인으로 맞추고 벤치프레스처럼 미세요."],"Smith machine front squat":["Rest the bar on the front of your shoulders with elbows high, then squat deep.","바를 어깨 앞에 얹고 팔꿈치를 높게 유지한 채 깊게 앉으세요."],"Smith machine deadlift":["Bar over mid-foot, push the floor away and keep your back neutral.","바를 발 중앙 위에 두고 바닥을 밀어내며 허리를 중립으로 유지하세요."],"Smith machine good morning":["Bar on your upper back with soft knees, hinge at the hips and keep your back flat.","바를 등 위에 얹고 무릎을 살짝 굽힌 채 엉덩이를 접으세요."],"Smith machine Bulgarian split squat":["Rear foot on the bench behind you, squat down on the front leg.","뒷발을 벤치에 올리고 앞다리로 앉으세요."],"Smith machine seated calf raise":["Sit with the padded bar over your knees and raise your heels.","앉아서 바를 무릎 위에 올리고 발뒤꿈치를 들어 올리세요."]});
